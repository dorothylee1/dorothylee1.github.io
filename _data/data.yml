            - 국내 대형 뷰티 리테일 기업 · 500명 · 제품 미완성 상태에서 딜리버리 완료 Apps Script로 세팅·점수 산출/분석 자동화 직접 구현 → 해당 로직 제품 정식 기능 채택.
            - 국내 통신 대기업 PO 역량 사전·사후 비교 · 30명 · 리커링 계약으로 이어짐. 사내 최초 사전·사후 비교 리포트 포맷 설계 → 이후 타 프로젝트 표준으로 채택.
            - 글로벌 HR 파트너사 '캐럿글로벌' 연계 제조 역량 진단 · 150명+ · 텔타 최초 파트너십 모델영문·인도네시아어 다국어 채점 파이프라인 재설계. 채점·문구 생성 특화 모델 분리 실험으로 정확도·품질 동시 향상.

      - title: 클라썸(Telta AI) | 리더십 역량 AX 진단 운영 및 프로세스 자동화
        tagline: | 
            진단 유형별로 루브릭·채점·리포트 파이프라인을 표준화하고, 고도화된 구조를 이후 프로젝트에 재적용하는 방식으로 품질과 속도를 동시에 높여왔음.
            
        details: |
            - 국내 최대 공기업 리더십센터 · 300명+, 2,000부+ · 월 1천만원+ 리커링 · 본사 강연 초청. 28개 루브릭 설계 (~5만 줄), AI 모델 간 편차 통계 검증. n8n 파이프라인으로 50명 리포트 5분 내 생성. 누적 DB화·대시보드 제품 탑재.
            - 국내 최대 공기업 인재육성실 · 200~300명 · 5억 원 입찰 수주 기여. 3단계 QA 파이프라인 직접 설계 (Rule-based → LLM-as-a-Judge → Vision LLM Cross-validation). 리포트 완결성 99.9% 달성. 실제 운영 시나리오 데모 제작 후 입찰 수주에 직접 기여.
            - 국내 대기업 그룹 연수원 신임 임원 · 147명, 300건. 임원급 인사 의사결정 직결 — Apps Script 자동 매핑→PDF 파이프라인 구축. 코치 1인 1일/건 → 147명 전원 2일 내 딜리버리. 인당 제작 시간 99% 단축.     
    
      - title: 카카오(Kakao) | 국내외 IT 정책 및 산업 동향 분석 & 인사이트 발굴
        tagline: | 
            카카오 정책팀 산하 연구보조원으로 C-level 경영진 의사결정에 필요한 마켓 인사이트를 도출하고 정기적으로 보고하는 역할을 담당했음. 인터넷·통신·미디어·AI·블록체인 등 기술 산업 정책 변화와 글로벌 규제 동향이 카카오 사업에 미치는 영향을 분석하고, AI 윤리·데이터 보호·콘텐츠 규제 관련 전략적 대응 방안을 제안했음. 크롤링·NLP 텍스트 마이닝·감성 분석으로 공공 데이터 및 신산업 트렌드를 정량 분석했으며, 국내외 전문가 FGI를 통해 인사이트를 확보하고 영문 리포트를 작성하여 기업의 의사결정을 지원했음.
            
      - title: 카카오(Kakao) | 데이터 기반 기술 트렌드 분석 업무 체계화
        tagline: | 
            담당자 개인 역량에 의존하던 트렌드 분석 업무의 일관성 부재와 재현성 한계를 해소하기 위해, 보고서 템플릿 4종 직접 개발·표준화, 엑셀 대시보드·텍스트 마이닝·감성 분석 기반 정량 분석 프로세스를 도입했음. 그 결과 분석 소요 시간 50%+ 단축, 커버리지 속도 12.3일→5.8일 개선, 전략 보고서 80건 발행. 해당 프로세스를 기반으로 사내 동향 & 인사이트 TF 신설에 기여했음.
            
      - title: 카카오(Kakao) | 카카오그룹 사회경제적 가치 분석 프로젝트
        tagline: | 
            카카오그룹 사회경제적 가치 분석 프로젝트에 참여하여 리서치 및 장표 제작에 기여했음. 생산유발효과·부가가치유발효과·고용유발효과 등 경제적 파급효과 분석 자료를 조사·정리했으며, 이용자·파트너·사회 등 이해관계자별 10가지 분야의 사회경제적 가치 지표 구성에 기여했음. 해당 결과는 2024년 생산유발효과 19.1조 원, 고용유발효과 5만 4천 명 규모의 카카오 공식 보도자료로 발표됐음.
        details: |
            -  [<u>카카오 기업사이트(사회적 기여)</u>](https://www.kakaocorp.com/page/responsible/socialValue)
            -  [<u>카카오 그룹의 사회경제적 가치 2025</u>](https://brunch.co.kr/@kakao-it/488)
            
      - title: KAIST | 석사 논문 - 가상현실 VR게임 성공에 영향을 미치는 요인 분석 연구
        tagline: | 
            마케팅 관점에서 VR 게임 성공 요인을 실증 분석한 연구가 부재한 가운데, 사회적 존재 이론을 프레임워크로 설정하고 정량·정성 혼합 방법론으로 연구를 설계·수행했음. 연구 1에서는 6만 7천 건의 사용자 트래픽 데이터를 계량경제모형으로 분석하여 동시 플레이어 수·라이브 스트리밍·360도 공간 활용이 게임 다운로드에 유의미한 영향을 미침을 실증했음. 연구 2에서는 66만 건의 리뷰 데이터에 LDA 토픽 모델링을 적용하여 5개 핵심 소비자 언급 주제를 도출했음. VR 게임의 성공이 기술적 완성도보다 사회적 연결감과 공간적 몰입감에 더 크게 좌우된다는 실증적 근거를 확보하여 VR·메타버스 시장 진입 전략에 대한 데이터 기반 시사점을 제공했음.
            
        details: |
            -  [<u>Virtual Socialness: Determinants of VR Game Success, focusing on the social presence theory</u>](https://drive.google.com/file/d/1_T2UU8aN3LVZaNNi0e_AwQ8mKIEJAEft/view?pli=1)

      - title: KAIST | 머신러닝·딥러닝 활용 빅데이터 분석 — 클라우드 펀딩 성공 예측 모델 분석
        tagline: | 
            LSA·LDA·BERT로 펀딩 소개글 텍스트 특성을 추출하고, Decision Tree·Random Forest·SVM·KNN 4가지 모델의 성능을 비교 검증했음. SVM이 테스트 정확도 93.3%, Precision 68.2%로 최우수 성능을 기록했으며, Baseline 대비 정확도 10%p·Precision 62%p 향상을 달성했음. K-means clustering으로 소비자를 소액 다수형·대형·재구매형으로 분류하여 유형별 성향을 분석했음. 텍스트와 정형 데이터를 결합한 혼합 방법론이 펀딩 성공 예측 정확도를 유의미하게 끌어올릴 수 있음을 실증했음.
            
      - title: KAIST | 대전오월드 중/단기 발전 경영계획 수립 프로젝트
        tagline: | 
            실제 기업 대상 경쟁 입찰 프로젝트로 최종 2위 기록. 공간 활용 불균형·브랜드 차별화 부재·부정적 가격 인식이라는 복합 경영 문제를 해결하기 위해 As-Is 현황 분석부터 To-Be 전략 도출까지 전 과정을 설계·수행했음. FGI·설문·NLP 감성 분석으로 VOC를 정량화하고, 컨조인트·번들링 분석으로 가격 전략을 시뮬레이션했음. 타깃 세분화·포지셔닝 분석을 통해 시장 내 전략적 위치를 재정의하고, 공간 운영 활성화·가격 전략·IMC 마케팅을 포함한 중단기 실행 로드맵을 최종 제안했음.
        details: |
            -  [<u>대전오월드 중/단기 발전 경영 계획 발표자료</u>](https://drive.google.com/file/d/1EM4NevIc40y0YKLTGZ_gD4O9BchAavlM/view?usp=sharing)
      - title: NIA(한국지능정보사회진흥원) | 디지털 플랫폼 정부 표준 및 가이드라인 제안 (제로 트러스트 클라우드 부문) 연구보조
        tagline: | 
            KAIST 이철호 교수님 연구실 연계로 NIA 연구활동에 참여, 제로 트러스트 클라우드 부문 챕터 약 100페이지를 단독 담당했음. 공공 부문의 제로 트러스트 보안 아키텍처 적용 기준이 부재한 상황에서, Traditional→Advanced→Optimal 3단계 도입 로드맵을 Identity·Device·Network·Application·Data 5개 축으로 구조화했음. 보안 기본 원칙·도입 목표·세부 요소·핵심 질문을 체계적으로 문서화하여 공공기관 시스템 기획 시 준수 기준을 제언했음. 최종 산출물은 NIA 2023 국가지능정보화백서 기반 정책 가이드라인 보고서로 발간됐음.
        details: |
            -  [<u>한국지능정보사회진흥원_2023 국가지능정보화백서</u>](https://www.nia.or.kr/site/nia_kor/ex/bbs/View.do?cbIdx=44086&bcIdx=26671&parentSeq=26671)
            
      - title: STEPI 과학기술정책연구원 | 글로벌 자동차 산업의 기술 패러다임/비즈니스 모델 분석
        tagline: | 
            한동대학교 양희태 교수님 산하 STEPI 연계 연구활동으로, 최종 보고서 발간됨. 전통 완성차 업체와 테슬라·구글 등 후발 진입자의 케이스 스터디를 중심으로 R&D 기술 발전 동향과 비즈니스 모델을 비교·분석하고 전략적 임플리케이션을 도출했음. 전기차(32.4%)·자율주행(22.8%)·레거시(33.4~44.7%) 부문으로 가치사슬 변화를 구조화하고, 기계·화학·전자 3대 산업 융합으로의 전환 흐름을 정리했음. 부품군별 경쟁력 전망 데이터를 활용하여 전략적 대응 방식과 정책 지원 우선순위를 제언하는 최종 보고서 작성에 기여했음.
        details: |
            -  [<u>급진적 혁신에서 살아남기: 자동차 산업의 기술 패러다임 변화와 한국의 대응 전략</u>](https://www.stepi.re.kr/site/stepiko/report/View.do;jsessionid=46C201F0236BED22BF9252D577CC1B4E?cbIdx=1292&reIdx=1042&cateCont=A0201)
            
publications:
    title: Awards
    papers:
      - title: <u>[대상] KAIST Case Competition</u>
        link: "https://www.linkedin.com/feed/update/urn:li:ugcPost:7130114158280273921/"
        authors: KAIST 경영대학
        conference: 13개 팀 중 대상 수상. PM으로서 전공이 다른 팀원들의 강점을 살린 역할 재조정을 주도했음. C-level 임원 인터뷰와 300건 이상의 문헌 분석을 통해 고피자의 DX 성과를 정량화했으며, 초기 투자 비용 3천만원 절감, 인건비·교육비·손실률 50% 절감 수치를 도출했음. VRINE 모델, 전후방통합 모델을 적용해 글로벌 진출 전략을 분석한 결과물은 이후 KAIST 기술경영 강좌의 DX 전략 학습 교재로 채택됐음.
      - title: <u>[최우수상] 세종컨설팅그룹 체인베스트 대학생 토큰 기획 공모전</u>
        link: "assets/pdf/The Effect of Intellectual Property-Based Startups on Employment.pdf"
        authors: 세종컨설팅그룹
        conference: 최우수상 수상. NFT 시장이 일시적 열풍을 넘어 실질적 투자 구조로 확장될 수 있는 방안을 제시했음. NFT 조각화 기능과 DeFi의 이자 배당 구조를 결합하여, 고가 NFT를 여러 조각으로 분할하고 예치 시 플랫폼 수익 기반의 이자를 배당하는 투자형 구조를 설계했음. 재판매 수익을 조각 보유자에게 비율 배분하고, 거래 수수료·광고·렌탈 등 플랫폼 수익모델과 연계하는 구조로 유동성과 투자 가치를 동시에 확보했음. NFT 투자자 그룹 대상 수익 창출형 메시지 전략과 Web3 입문자 대상 온보딩 캠페인을 설계하고, 인플루언서 기반 콘텐츠 마케팅 전략을 종합 제안했음. 기술 구조를 시장성과 연결하는 기획 역량을 실전에서 검증했음.
      - title: <u>[1위] CGNTV OTT 플랫폼 콘텐츠 기획 및 IMC 캠페인 제안 공모전</u>
        link: "https://www.youtube.com/playlist?list=PLKWaBw98ldzPVCaUchsRVUIeENOZog1eI"
        authors: CGNTV
        conference: 1위 수상. 기독 OTT 플랫폼 [퐁당]의 20대 크리스천 사용률이 낮다는 문제를 해결하기 위해 타깃 대상 인터뷰·설문을 직접 진행하여 인사이트를 도출했음. 20대가 공감할 고민을 에피소드별로 주제화한 웹드라마 + 패널 조언 형식의 콘텐츠 [고밍아웃]을 기획하고, IMC 통합마케팅캠페인 전략을 함께 제안했음. 1위 수상 이후 제안한 콘텐츠 포맷이 실제로 CGNTV에서 [고밍아웃]이라는 프로그램명으로 제작·방영됐음.
      - title: <u>[Special Awards] UNESCO UNITWIN 지속가능성을 위한 신제품 기획 경쟁 대회</u>
        link: "https://www.handong.edu/eng/global/projects/unitwin/"
        authors: UNESCO UNITWIN
        conference: 몽골 자브항 지역의 지속가능한 관광을 위한 신제품 개발 프로젝트에서 스페셜 상 수상. 현지 인프라 및 자원을 활용한 관광패키지 개발 및 운영안 제안. 몽골 현지 학생 대상 Business Model Canvas, Field Research 영어 강의 진행.



