      - title: 클라썸(Telta AI) | 파트너사 연계 프로젝트 - 글로벌 제조 역량 진단 (AI-GTA) 운영 및 자동화 
        tagline: | 
            텔타 최초의 파트너십 모델로 진행된 프로젝트로, 파트너사(캐럿글로벌)가 영업·현장 운영을 담당하고 텔타는 글로벌 제조 역량 진단 솔루션(AI-GTA)을 납품하는 구조였음. 고객사–파트너사–텔타 간 3자 이해관계를 조율하는 것이 핵심 과제였으며, 파트너사가 텔타 제품을 독립적으로 운영할 수 있도록 운영 가이드 및 FAQ를 직접 설계하여 전달했음. 
            가이드는 "파트너사가 자체적으로 처리할 수 있는 항목"과 "텔타에 요청해야 하는 항목"을 명확히 구분하는 두 컬럼 구조로 제작하여 불필요한 커뮤니케이션 비용을 최소화했음.대표 운영 사례로 글로벌 자동차 부품 대기업 100명 대상 역량 진단을 운영했음. 식품·담배 제조 대기업 대상으로는 영문·인도네시아어 다국어 진단을 설계·운영했으며, 언어 간 채점 기준 일관성 확보를 위해 진단 과제·리포트·전처리 프로세스 전반을 영문화했음. 단순 번역이 아니라 AI 채점 모델이 영문 발화 데이터를 동일한 기준으로 평가할 수 있도록 채점 파이프라인 전체를 다국어 환경에 맞게 재설계했음.
            또한 파트너사가 진단 현황을 독립적으로 모니터링할 수 있도록 제품팀과 협업하여 채널별 기능을 개발했음. 루브릭 6건을 고도화하고 채점 워크플로우를 10개 이상의 태스크 단위로 세분화하여 안정성과 재사용성을 높였음. 
            루브릭 고도화 과정에서는 역할을 기능별로 분리하여 최적 AI 모델을 선정하는 실험을 진행했음. 점수 채점에 특화된 모델과 코멘트 문구 생성에 특화된 모델을 각각 별도로 테스트하고 성능을 비교하여, 기능별로 최적 모델을 선정하는 구조로 파이프라인을 재설계했음. 단일 모델로 채점과 문구 생성을 동시에 처리하던 방식 대비 채점 정확도와 문구 품질을 동시에 끌어올릴 수 있었음.
        details: |
            -  [<u>[Video] Security Policy Analysis Tool&#58; Powered by AI</u>](https://drive.google.com/file/d/1jQsCxqj_f1y3KY931r1e8algTwl_1Zc2/view?usp=sharing)
            
      - title: 클라썸(Telta AI) | 국내 대형 뷰티 리테일 기업 전사 승진 평가 운영 및 자동화
        tagline: | 
            직군·직무별 스킬셋 정의부터 역량 진단 수행, 리포트 발행까지 전 과정을 A to Z로 진행한 텔타 최초의 완전 통합 운영 사례임. 진단 세팅이 필요한 시점에 제품 자체가 미완성 상태였으나 일정을 지연할 수 없는 상황이었음. 점수 자동 계산, 선지 랜덤 배치, 문항 세팅 등 미개발 기능들을 자동화하거나 수작업으로 보완하며 프로젝트를 완료했음.
            Apps Script를 직접 작성하여 진단 세트 120건의 세팅을 자동화했음. 당시 제품은 서베이 제출 후 점수가 자동 산출되지 않고 선지 데이터만 출력되는 상태였으며, 직군·직급·연차별로 문항과 배점이 상이한 복잡한 구조를 Master Map으로 정의하고 이를 코드로 구현하여 점수 산출 스크립트를 직접 제작했음. 이 로직은 이후 제품팀과 공유하여 정식 기능으로 내재화됐음.
            제품팀과의 협업은 Bug 채널, Cowork 채널, 월 1회 Monthly 스크럼을 통해 정기적으로 진행했음. 고객사 VOC를 정확히 전달하기 위해 현장 이슈를 체계적으로 기록·정리하여 제품 개선 Input으로 제공했으며, 피드백 루프를 통해 제품 고도화에 지속적으로 기여했음.
            리포트 템플릿과 서베이 단독 진단 운영 파이프라인을 직접 설계했으며, 이는 이후 다수 프로젝트의 초기 구조로 활용되어 제품화 및 자동화의 기반이 됐음. 제품이 완성되지 않은 상황에서도 운영을 완수하고, 그 과정에서 도출된 로직과 구조가 제품 자산으로 전환된 사례로, 현장 운영과 제품 개발 간의 피드백 루프를 직접 설계·실행했음.

        details: |
            -  [<u>[PPT] Building a RAG system specialized for Korean in closed network</u>](https://docs.google.com/presentation/d/16MwlVt9q-y66UzTJpu8qd78cAQTPR9NWt-0e4M75fXc/edit?usp=sharing)
            -  [<u>[Table] Qualitative evaluation after fine-tuning LLM for RAG</u>](https://docs.google.com/spreadsheets/d/18-tnpUWg0VXfrWvEcGOkj-Ok70jKF7yTTF02zg9VGBE/edit?usp=sharing)
            
      - title: 클라썸(Telta AI) | 외부 강의 - 이화여대 교양 강의 파견 (26년 1학기)
        tagline: | 
            이화여대 교양 과목 '인공지능융합교육의 이해' 수업에 파견 강사로 초청되어 강의를 진행했음. 강의 주제는 'AI로 생겨나는 자동화(Project Delivery) 직업과 관련 전공자들을 위한 학업 및 진로 준비 방법'으로, 현장 실무 경험을 기반으로 AI 전환 시대의 새로운 직무 패러다임을 직접 설계·전달했음.
            강의는 크게 4개 챕터로 구성됐음. 1장에서는 AI와 일자리 변화를 데이터 기반으로 제시했음. WEF Future of Jobs 2025, Goldman Sachs 리서치 등을 인용해 "AI가 직업을 없애는 것이 아니라 바꾸는 것"이라는 관점을 수치로 설명하고, 콜센터 상담원 → AI 챗봇 운영자, 채용 스크리닝 → AI 채용 시스템 기획자 등 실제 직무 전환 사례를 제시했음. 2장에서는 AI 직업군을 'AI를 만드는 사람 / AI를 실제와 연결하는 사람 / AI를 운영·관리하는 사람'의 3가지 레이어로 구조화하여, 어떤 전공이든 AI 관련 직무에 진입 가능하다는 메시지를 전달했음. 3장에서는 텔타에서의 실제 Project Delivery 직무를 소개했음. 고객사 프로젝트 딜리버리, 자동화 아이템 기획 및 설계, 제품화 프로세스 기획이라는 3축 구조와 실제 자동화 도구 이력(STT 보정 66% 절감, 리포트 생성 98% 절감, QA 파이프라인 등)을 현장 사례로 직접 공유했음. 4장에서는 전공별 진입 경로와 학년별 커리어 로드맵을 제시했음.
            강의 중간에는 학생들이 직접 자신의 일상(대학 생활, 아르바이트, 취업 준비 등)에서 AI로 자동화할 수 있는 문제를 발굴하고 팀별로 아이디어를 발표하는 워크숍 세션을 설계·운영했음. "문제를 발견하고 AI로 해결 방법을 기획하는 것"이 Project Delivery의 핵심 역량임을 체험 기반으로 전달하는 방식이었음.
            자신의 커리어와 실무 경험을 체계적으로 언어화하여 비전공자 대상으로 전달한 사례로, 외부 전문가로서 초청받아 강의를 설계·운영했음.
        details: |
            -  [<u>[PPT] Korean Embedding Model in RAG system</u>](https://docs.google.com/presentation/d/1Ef7ARwoXb7u1CL1n2IF7wi-hWxfGUA4cRb_-F_edq4c/edit?usp=sharing)
            -  [<u>[PPT] Word Embedding</u>](https://docs.google.com/presentation/d/1LL8OU4HaWoQDwr2Mx6qYCDtkZVvWVs2ba_XWYq9qUpI/edit?usp=sharing)

      - title: 카카오(Kakao) | 국내외 IT 정책 및 산업 동향 분석 & 인사이트 발굴
        tagline: | 
            카카오 정책팀 산하 연구보조원으로 재직하며, 각 계열사의 사업 전략 수립을 지원하기 위해 국내외 디지털 정책 및 산업 동향 분석, 신산업 및 기술 트렌드 파악, 정형·비정형 데이터 분석을 수행했음. 경영진 의사결정에 필요한 마켓 인사이트를 도출하고 정기적으로 보고하는 역할을 맡았음.
            인터넷, 통신, 미디어, AI, 블록체인 등 다양한 기술 산업의 정책 변화를 조사하고, 글로벌 규제 동향이 카카오 사업에 미치는 영향을 분석했음. 특히 AI 윤리, 데이터 보호, 콘텐츠 규제 등과 관련된 정책적 방향성을 제시하며, 글로벌 리포트 및 공공기관 자료를 기반으로 전략적 대응 방안을 제안했음.
            AI, 메타버스, Web3, 디지털 헬스케어 등 급변하는 신산업 분야의 시장 흐름을 모니터링하고, 경쟁사의 전략 및 협업 사례를 분석하여 계열사의 사업 기회 발굴을 지원했음. 벤처 캐피털 및 스타트업 투자 동향을 연구하여 유망 기술 및 사업 모델을 도출했음.
            크롤링, NLP 기반 텍스트 마이닝, 데이터 시각화 등을 활용하여 공공 데이터 및 기술 트렌드를 분석하고, 사회적 이슈가 플랫폼 경제에 미치는 영향을 정량적으로 평가했음. 국내외 산업 전문가 및 학계 연구진과의 인터뷰 및 FGI(Focus Group Interview)를 통해 현업 및 정책적 인사이트를 확보하고, 글로벌 정책 변화 및 해외 시장 진출 전략 관련 영문 리포트를 작성하여 기업의 의사결정을 지원했음.
            
      - title: 카카오(Kakao) | 데이터 기반 기술 트렌드 분석 업무 체계화
        tagline: | 
            기존 트렌드 분석 업무는 담당자 개인의 역량과 판단에 의존하는 구조로, 분석 기준이 일관되지 않고 인사이트의 재현성이 낮다는 한계가 있었음. 이를 해결하기 위해 1)일관된 커뮤니케이션 체계 수립 2)데이터 기반 분석 프로세스 정립이라는 두 가지 목표를 설정하고 업무 체계화를 주도했음.
            글로벌 테크 기업의 데이터 정책과 AI·플랫폼 기술, 규제 동향을 분석하고 카카오 사업에의 영향을 평가하는 보고 체계를 구축했음. 4가지 유형의 보고서 템플릿을 직접 개발하여 분석 기준과 커버리지를 명확히 정의했으며, 전문가 코멘트와 시각화를 결합해 인사이트의 질을 높였음. 정량 기반 의사결정 지원을 위해 엑셀 대시보드, 텍스트 마이닝, 감성 분석을 활용한 프로세스를 도입했음.
            그 결과 동향 분석 소요 시간을 평균 50% 이상 단축했으며, 총 80건의 전략 보고서를 발행했음. 커버리지 속도도 12.3일에서 5.8일로 개선됐음. 신규 아젠다를 발굴하고 현업에서 바로 활용 가능한 분석 프레임을 구축하는 과정은 단순한 과제를 넘어 분석 업무 자체를 전략적 판단을 지원하는 체계로 전환했으며, 해당 프로세스를 기반으로 사내 '동향 & 인사이트 TF'가 신설되는 데 기여했음.

      - title: KAIST | 석사 논문 - 가상현실 VR게임 성공에 영향을 미치는 요인 분석 연구
        tagline: | 
            VR 게임 산업이 빠르게 성장하고 있었으나, 기존 연구는 대부분 실험·설문 기반의 기술적 사용자 경험에 집중되어 있었음. 마케팅 관점에서 VR 게임의 실제 성공 요인을 실증적으로 분석한 연구는 거의 존재하지 않았으며, 이 연구 격차를 해소하고자 본 논문을 직접 설계하고 수행했음.
            사회적 존재 이론을 이론적 프레임워크로 설정하고, 두 개의 연구를 병행했음. 연구 1에서는 약 6만 7천 건의 실시간 사용자 트래픽 데이터를 수집·가공하여 계량경제모형으로 분석했음. 동시 플레이어 수, 라이브 스트리밍 시청자 수, 전체 VR 지원 여부, 360도 공간 활용을 핵심 변수로 설정하고, 이들이 게임 다운로드에 미치는 영향을 실증했음. 공간 변수에 대한 장르와의 상호작용 효과와 멀티플레이어 여부의 조절 효과도 함께 검증했음. 연구 2에서는 66만 건의 온라인 리뷰 데이터를 수집하고 LDA(Latent Dirichlet Allocation) 토픽 모델링을 적용하여 소비자 언급의 주요 주제를 추출했음. 분석 결과 '게임 메커닉스 및 디자인', '커뮤니티 및 사회적 상호작용', '플레이어 참여 및 즐거움', '인터랙티브 및 감각적 특성', '시각적·공간적 특성' 5개의 핵심 토픽이 도출됐음.
            계량경제모형과 LDA를 결합한 혼합 방법론으로 정량·정성 데이터를 동시에 분석하여, VR 게임의 성공이 기술적 완성도보다 사회적 연결감과 공간적 몰입감에 더 크게 좌우된다는 실증적 근거를 확보했음. VR·메타버스 시장을 공략하는 산업 이해관계자들에게 데이터 기반의 전략적 시사점을 제공하는 데 기여했음
            
        details: |
            -  [<u>Virtual Socialness: Determinants of VR Game Success, focusing on the social presence theory</u>](https://drive.google.com/file/d/1_T2UU8aN3LVZaNNi0e_AwQ8mKIEJAEft/view?pli=1)

      - title: KAIST | 머신러닝·딥러닝 활용 빅데이터 분석 — 클라우드 펀딩 성공 예측 모델 분석
        tagline: | 
            기업경영을 위한 인공지능 수업의 개인 프로젝트로 수행함. 클라우드 펀딩 플랫폼은 다양한 소비자 유형이 혼재하는 특성상 단일 마케팅 전략으로는 효과를 내기 어렵다는 문제의식에서 출발했음. 펀딩 성공 여부에 영향을 미치는 요인을 데이터 기반으로 규명하고, 소비자를 행동 패턴에 따라 체계적으로 분류하는 예측 모델 개발에 중점을 뒀음.
            분석은 세 단계로 구성했음. 첫째, 텍스트 데이터 분석 단계에서는 자연어처리(NLP) 기법인 LSA, LDA, BERT를 활용하여 펀딩 소개글(tagline, description)에서 주요 주제와 특성을 추출했음. 둘째, 예측 모델 개발 단계에서는 펀딩 기간, 목표 금액, 달성률, 카테고리, 소개글 길이 등을 변수로 설정하고 Decision Tree, Random Forest, SVM, KNN 총 4가지 모델의 성능을 비교 검증했음. 그 결과 SVM이 테스트 정확도 93.3%, Precision 68.2%로 가장 우수한 성능을 보였으며, Random Forest가 F1 score 52.1%로 정밀도와 재현율의 균형 면에서 두 번째로 우수했음. 셋째, 소비자 유형 분류 단계에서는 K-means clustering을 활용하여 소비자를 소액 다수형, 대형, 재구매형으로 분류하고 유형별 성향을 분석했음.
            Baseline 모델 대비 SVM 기준으로 테스트 정확도 약 10%p, Precision 약 62%p 향상을 달성했음. 텍스트 기반 특성 추출과 정형 데이터를 결합한 혼합 접근이 펀딩 성공 예측의 정확도를 유의미하게 끌어올릴 수 있음을 실증했음. 이를 통해 머신러닝·딥러닝 기법을 직접 적용하여 텍스트와 정형 데이터를 결합한 혼합 분석 방법론을 설계·검증했음.
            
      - title: KAIST | 대전오월드 중/단기 발전 경영계획 수립 프로젝트
        tagline: | 
            KAIST 수업 기반으로 대전오월드를 대상으로 한 실제 경영계획 입찰 프로젝트로, 2023년 9월부터 11월까지 수행했음. 단순 수업 과제가 아니라 실제 기업을 대상으로 한 경쟁 입찰 형태로 진행됐으며, 최종 2위를 기록했음. 대전오월드는 공간 활용도 불균형, 가격에 대한 부정적 소비자 반응, 경쟁사 대비 차별화된 브랜드 및 특색의 부재, 마케팅·홍보 활동 저조라는 복합적인 경영 문제를 안고 있었음. 이를 해결하기 위해 현황 분석(As-Is)부터 전략 도출(To-Be)까지 전 과정을 설계하고 수행했음.
            FGI, 설문조사, 자연어처리(NLP)와 감성 분석(Sentiment Analysis)을 결합하여 VOC 데이터를 수집·분석했음. 소비자 인식과 경쟁 환경을 정량적으로 파악한 뒤, 타깃 세분화·포지셔닝 분석을 통해 시장 내 전략적 위치를 재정의했음. 컨조인트 분석과 번들링 전략을 통해 수요와 수익을 예측하고, 효율적인 가격 책정과 번들링 전략을 시뮬레이션했음. 분석 결과를 바탕으로 오월드 공간 구성 및 운영 분야별 활성화 방안, 고객 만족 가격 전략 및 번들링 전략, 차별화된 마케팅·홍보 전략을 포함한 중단기 경영계획 실행 로드맵을 최종 제안했음.
    
      - title: NIA(한국지능정보사회진흥원) | 디지털 플랫폼 정부 표준 및 가이드라인 제안 (제로 트러스트 클라우드 부문) 연구보조
        tagline: | 
            KAIST 이철호 교수님 연구실 연계로 NIA(한국지능정보사회진흥원) 연구활동에 참여했음. 2023년 10월부터 2024년 2월까지 진행됐음. 디지털 플랫폼 정부로의 DX 전환이 국가 핵심 과제로 부상하면서, 클라우드 환경에서의 보안 체계와 정책 표준에 대한 실질적인 가이드라인이 부재한 상황이었음. 특히 기존 경계 보안 모델의 한계를 넘어서는 제로 트러스트 보안 아키텍처를 공공 부문에 어떻게 적용할 것인지에 대한 구체적인 기준이 없었음.
            문헌 조사부터 제로 트러스트 클라우드 부문 챕터 작성까지 약 100페이지 분량을 단독으로 담당했음. 제로 트러스트 보안 모델을 Traditional, Advanced, Optimal 3단계로 구조화하고, Identity·Device·Network Environment·Application Workload·Data 5개 축에 걸친 단계별 도입 로드맵을 설계했음. 기존 기관 정보시스템 보안과 클라우드 컴퓨팅 환경의 특성에 대한 연속성 유지, 보안위협 대응, 민간 사업자 신뢰성 확인을 목적으로 기술적·정책적 측면의 보안 기본 원칙을 정리했음. 시스템 구축 및 기획 시 준수해야 할 기본원칙, 목표, 세부 요소, 핵심 질문과 도출 근거를 체계적으로 문서화했으며, 보안 및 개인정보 보호 측면의 가이드라인을 제언했음.
            최종 산출물은 NIA 2023 국가지능정보화백서를 참고 자료로 활용하여 실제 정책 기반 위에서 작성됐음. 
        details: |
            -  [<u>한국지능정보사회진흥원_2023 국가지능정보화백서</u>](https://www.nia.or.kr/site/nia_kor/ex/bbs/View.do?cbIdx=44086&bcIdx=26671&parentSeq=26671)
            
      - title: STEPI 과학기술정책연구원 | 글로벌 자동차 산업의 기술 패러다임/비즈니스 모델 분석
        tagline: | 
            한동대학교 양희태 교수님 산하 연구활동으로 STEPI(과학기술정책연구원)와 연계하여 진행했음. 2022년 4월부터 6월까지 수행됐으며, 최종 보고서가 발간됐음. 전기동력 자율주행차로의 전환은 단순한 기술 개선이 아닌 급진적 혁신 사례에 해당하며, 이 전환이 산업 가치사슬 전반에 미치는 구조적 영향을 혁신 이론 관점에서 체계적으로 분석한 연구가 부족한 상황이었음.
            본인은 전통 완성차 업체와 테슬라·구글 등 후발 진입자의 케이스 스터디를 중심으로 자료조사를 담당했음. 각 기업의 R&D 기술 발전 동향과 새로운 비즈니스 모델을 비교·분석하고, 타산업과의 융합 현황을 정리하여 전략적 임플리케이션을 도출했음. 전기차 부문(32.4%), 자율주행 부문(22.8%), 레거시 부문(33.4~44.7%)으로 가치사슬 변화를 구조화하고, 기계 산업에서 기계·화학·전자 3대 산업의 융합산업으로의 전환 흐름을 정리했음. 자동차 부품군별 발전 가능성 데이터를 활용하여 레거시·전기·자율주행 부문별 경쟁력 전망을 도출했으며, 경쟁 현황·전략적 대응 방식·정책적 지원의 우선순위를 제언하는 최종 보고서 작성에 기여했음.
        details: |
            -  [<u>급진적 혁신에서 살아남기: 자동차 산업의 기술 패러다임 변화와 한국의 대응 전략</u>](https://www.stepi.re.kr/site/stepiko/report/View.do;jsessionid=46C201F0236BED22BF9252D577CC1B4E?cbIdx=1292&reIdx=1042&cateCont=A0201)
            
publications:
    title: Awards
    papers:
      - title: [대상] KAIST Case Competition
        authors: KAIST 경영대학
        conference: 13개 팀 중 대상 수상. PM으로서 전공이 다른 팀원들의 강점을 살린 역할 재조정을 주도했음. C-level 임원 인터뷰와 300건 이상의 문헌 분석을 통해 고피자의 DX 성과를 정량화했으며, 초기 투자 비용 3천만원 절감, 인건비·교육비·손실률 50% 절감 수치를 도출했음. VRINE 모델, 전후방통합 모델을 적용해 글로벌 진출 전략을 분석한 결과물은 이후 KAIST 기술경영 강좌의 DX 전략 학습 교재로 채택됐음.
      - title: [최우수상] 세종컨설팅그룹 체인베스트 대학생 토큰 기획 공모전
        authors: 세종컨설팅그룹
        conference: 최우수상 수상. NFT 시장이 일시적 열풍을 넘어 실질적 투자 구조로 확장될 수 있는 방안을 제시했음. NFT 조각화 기능과 DeFi의 이자 배당 구조를 결합하여, 고가 NFT를 여러 조각으로 분할하고 예치 시 플랫폼 수익 기반의 이자를 배당하는 투자형 구조를 설계했음. 재판매 수익을 조각 보유자에게 비율 배분하고, 거래 수수료·광고·렌탈 등 플랫폼 수익모델과 연계하는 구조로 유동성과 투자 가치를 동시에 확보했음. NFT 투자자 그룹 대상 수익 창출형 메시지 전략과 Web3 입문자 대상 온보딩 캠페인을 설계하고, 인플루언서 기반 콘텐츠 마케팅 전략을 종합 제안했음. 기술 구조를 시장성과 연결하는 기획 역량을 실전에서 검증했음.
      - title: <u>The Effect of Intellectual Property-Based Startups on Employment</u>
        link: "assets/pdf/The Effect of Intellectual Property-Based Startups on Employment.pdf"
        authors: Haejun Jung, <b>Yongshin Kim</b>, Doohee Chung
